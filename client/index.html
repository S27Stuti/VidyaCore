<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#060813" />
    <meta name="format-detection" content="telephone=no" />
    <title>VidyaCore - Modern Campus Management &amp; Broadcast Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-[#060813] text-slate-900 dark:text-slate-100 antialiased m-0 p-0 min-h-screen">
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background-color:#060813;color:#ffffff;font-family:'Plus Jakarta Sans',sans-serif;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
          <div style="width:42px;height:42px;border:3px solid #10b981;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
          <p style="font-size:12px;color:#94a3b8;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;">Initializing VidyaCore...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
